<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EduTruth – Student & Mentor College Guidance</title>
<style>
:root{
  --brand:#0f766e;--brand-d:#115e59;--accent:#f59e0b;--bg:#f4f7f7;--card:#fff;--line:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--danger:#b91c1c;--ok:#15803d;--radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Telugu","Noto Sans Devanagari",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25}
p{margin:0 0 .8em}
a{color:var(--brand)}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header.top .bar{display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{font-weight:800;font-size:1.2rem;cursor:pointer;color:#fff;text-decoration:none;white-space:nowrap}
.spacer{flex:1}
.who{font-size:.85rem;opacity:.9;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header select{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 8px;font-size:.85rem}
header select option{color:#000}
.icon{position:relative;background:transparent;border:0;color:#fff;font-size:1.25rem;cursor:pointer;padding:4px 8px}
.badge{position:absolute;top:-2px;right:-2px;background:#dc2626;color:#fff;border-radius:999px;font-size:.65rem;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border-radius:20px;padding:34px 24px;margin-bottom:20px}
.hero h1{font-size:2rem}
.hero p{opacity:.9;font-size:1.05rem;margin:0}
.grid{display:grid;gap:14px}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.role .ic{font-size:2rem}
.card h3{font-size:1.05rem}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:.95rem;font-weight:600;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:var(--danger)}
.btn.ok{background:var(--ok)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.light{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5)}
label{display:block;font-size:.85rem;font-weight:600;margin:0 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem;background:#fff;color:var(--text);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(15,118,110,.35);border-color:var(--brand)}
textarea{min-height:90px;resize:vertical}
.field{margin-bottom:12px}
.formcard{max-width:560px;margin:0 auto}
.formgrid{display:grid;gap:0 12px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.formgrid{grid-template-columns:1fr}}
.alert{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:.92rem}
.alert.err{background:#fee2e2;color:#991b1b}
.alert.ok{background:#dcfce7;color:#166534}
.alert.info{background:#fef3c7;color:#92400e}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.tab{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.88rem;cursor:pointer;color:var(--text);font-weight:600}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.s{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700}
.s-pending-approval,.s-pending{background:#fef3c7;color:#92400e}
.s-verified,.s-accepted{background:#dcfce7;color:#166534}
.s-rejected{background:#fee2e2;color:#991b1b}
.tag{display:inline-block;background:#eef2f6;border-radius:999px;padding:2px 10px;font-size:.75rem;margin:2px 4px 2px 0}
.stat{text-align:left}
.stat .n{font-size:1.9rem;font-weight:800;color:var(--brand)}
.stat .l{color:var(--muted);font-size:.85rem}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.item .main{flex:1;min-width:200px}
.avatar{width:42px;height:42px;border-radius:50%;background:rgba(15,118,110,.12);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
dl.kv{margin:0;display:grid;grid-template-columns:130px 1fr;gap:6px 12px}
dl.kv dt{color:var(--muted);font-size:.85rem}
dl.kv dd{margin:0;word-break:break-word}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.empty .big{font-size:2.4rem}
.stars{display:flex;gap:2px}
.star{background:none;border:0;font-size:1.9rem;color:#cbd5e1;cursor:pointer;padding:0 2px}
.star.on{color:var(--accent)}
.rate{color:var(--accent);font-weight:700}
.chatbox{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:320px}
#msgs{flex:1;overflow-y:auto;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;gap:6px}
.bubble{max-width:78%;padding:8px 12px;border-radius:14px;word-break:break-word;white-space:pre-wrap;font-size:.95rem}
.bubble.mine{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.bubble.theirs{align-self:flex-start;background:#eef2f6;border-bottom-left-radius:4px}
.bubble .time{display:block;font-size:.68rem;opacity:.7;margin-top:2px}
.chatform{display:flex;gap:8px;margin-top:10px}
.chatform input{flex:1}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pagehead h2{margin:0;flex:1}
#modal{display:none}
#modal.show{display:block}
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 24px);pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:.92rem;max-width:520px}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--ok)}
.loading{text-align:center;padding:60px 0;color:var(--muted)}
.unread{border-left:4px solid var(--brand)}
@media(max-width:560px){.hero h1{font-size:1.5rem}.who{display:none}dl.kv{grid-template-columns:100px 1fr}}
</style>
</head>

var app = document.getElementById('app');
var modalEl = document.getElementById('modal');
var toastEl = document.getElementById('toasts');
function $(s) { return document.querySelector(s); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtDate(ts) { return new Date(ts).toLocaleDateString(); }
function fmtDT(ts) { return new Date(ts).toLocaleString(); }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
function initial(n) { return esc(String(n || '?').trim().charAt(0).toUpperCase() || '?'); }
function slug(s) { return String(s).toLowerCase().replace(/\s+/g, '-'); }
function badge(s) { return '<span class="s s-' + esc(slug(s)) + '">' + esc(s) + '</span>'; }
function empty(icon, msg) { return '<div class="empty"><div class="big">' + icon + '</div><div>' + esc(msg) + '</div></div>'; }

function toast(msg, type) {
  var d = document.createElement('div');
  d.className = 'toast' + (type ? ' ' + type : '');
  d.textContent = msg;
  toastEl.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 3500);
}

var S = {
  token: sessionStorage.getItem('et_token') || null,
  user: null, view: 'home', params: {}, unread: 0, flash: null,
  cf: { q: '', type: 'All', stream: 'All' },
  users: {}, colleges: {}
};

function api(method, url, body) {
  var headers = { 'Content-Type': 'application/json' };
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  return fetch(url, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined })
    .then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (!res.ok) {
          var e = new Error((data && data.error) || 'Request failed');
          e.status = res.status; e.code = data && data.code;
          throw e;
        }
        return data;
      });
    });
}
function errMsg(e) {
  if (e && e.code && I18N[lang]['err_' + e.code]) return I18N[lang]['err_' + e.code];
  return (e && e.message) || 'Something went wrong';
}
function handleErr(e) {
  if (e && e.status === 401 && S.user) {
    toast('Session expired. Please log in again.', 'err');
    endSession(); render();
    return;
  }
  toast(errMsg(e), 'err');
}

/* Navigation & session                                                */
/* ------------------------------------------------------------------ */
var ROLE_VIEWS = {
  admin: ['admin'],
  student: ['student', 'college', 'mentorProfile', 'chat'],
  mentor: ['mentor', 'studentProfile', 'chat']
};
function nav(view, params, opts) {
  S.view = view; S.params = params || {};
  var st = { view: S.view, params: S.params };
  if (opts && opts.replace) history.replaceState(st, '', location.pathname);
  else history.pushState(st, '', location.pathname);
  return render();
}
window.addEventListener('popstate', function (e) {
  S.view = e.state && e.state.view ? e.state.view : 'home';
  S.params = e.state && e.state.params ? e.state.params : {};
  render();
});
function guard() {
  var u = S.user, ok;
  if (!u) ok = (S.view === 'home' || S.view === 'auth');
  else ok = ROLE_VIEWS[u.role].indexOf(S.view) >= 0;
  if (!ok) {
    S.view = u ? u.role : 'home';
    S.params = u ? { tab: 'home' } : {};
    history.replaceState({ view: S.view, params: S.params }, '', location.pathname);
  }
}
function endSession() {
  stopPoll(); stopChat();
  S.token = null; S.user = null; S.unread = 0; lastRev = null; pendingRefresh = false;
  sessionStorage.removeItem('et_token');
  closeModal();
  S.view = 'home'; S.params = {};
  history.replaceState({ view: 'home', params: {} }, '', location.pathname);
}
function startSession(data) {
  S.token = data.token; S.user = data.user;
  sessionStorage.setItem('et_token', data.token);
  S.unread = 0; lastRev = null;
  startPoll();
  return nav(S.user.role, { tab: 'home' }, { replace: true });
}

/* Rendering core                                                      */
/* ------------------------------------------------------------------ */
var renderSeq = 0, lastKey = '';
function snapshot() {
  var o = {};
  app.querySelectorAll('input[id],textarea[id],select[id]').forEach(function (el) {
    if (el.id === 'lang') return;
    o[el.id] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return o;
}
function restore(o) {
  Object.keys(o).forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    if (el.type === 'checkbox') el.checked = o[id]; else el.value = o[id];
  });
}
function header() {
  var u = S.user;
  var opts = ['en', 'te', 'hi'].map(function (c) {
    var n = { en: 'English', te: 'తెలుగు', hi: 'हिन्दी' }[c];
    return '<option value="' + c + '"' + (c === lang ? ' selected' : '') + '>' + n + '</option>';
  }).join('');
  var right = '';
  if (u) {
    right = '<button class="icon" data-act="notifs" title="' + esc(t('notifications')) + '">🔔<span id="badge" class="badge"' +
      (S.unread > 0 ? '' : ' style="display:none"') + '>' + S.unread + '</span></button>' +
      '<span class="who">' + esc(u.name) + '</span>' +
      '<button class="btn small light" data-act="logout">' + esc(t('logout')) + '</button>';
  }
  return '<header class="top"><div class="bar"><a class="brand" data-act="home">🎓 ' + esc(t('appName')) + '</a><div class="spacer"></div>' +
    '<select id="lang" aria-label="' + esc(t('language')) + '">' + opts + '</select>' + right + '</div></header>';
}
function updateBadge() {
  var b = document.getElementById('badge');
  if (!b) return;
  b.textContent = S.unread;
  b.style.display = S.unread > 0 ? '' : 'none';
}
async function render() {
  var my = ++renderSeq;
  stopChat();
  guard();
  var key = S.view + JSON.stringify(S.params);
  var same = key === lastKey;
  var snap = same ? snapshot() : null;
  var sy = same ? window.scrollY : 0;
  var html;
  try {
    html = await VIEWS[S.view]();
  } catch (e) {
    if (my !== renderSeq) return;
    if (e.status === 401 && S.user) { toast('Session expired. Please log in again.', 'err'); endSession(); return render(); }
    html = '<div class="alert err">' + esc(errMsg(e)) + '</div><button class="btn" data-act="home">' + esc(t('home')) + '</button>';
  }
  if (my !== renderSeq) return;
  lastKey = key;
  app.innerHTML = header() + '<main class="wrap">' + html + '</main>';
  if (snap) restore(snap);
  window.scrollTo(0, sy);
  if (AFTER[S.view]) AFTER[S.view]();
}

var chatTimer = null, chatLastN = 0, chatReq = null;
function stopChat() { if (chatTimer) { clearInterval(chatTimer); chatTimer = null; } }
VIEWS.chat = async function () {
  var d = await api('GET', '/api/chat/' + encodeURIComponent(S.params.rid));
  chatReq = d.requestId; chatLastN = 0;
  var other = d.other ? d.other.name : '';
  var html = '<div class="pagehead">' + backBtn() + '<h2>💬 ' + esc(other) + '</h2></div><div class="chatbox"><div id="msgs">' + (d.messages.length ? '' : '<div class="muted" id="noMsgs" style="text-align:center">' + esc(t('noData')) + '</div>') + '</div>' +
    '<form class="chatform" data-form="chat" autocomplete="off" novalidate><input id="msg" name="msg" type="text" maxlength="2000" placeholder="' + esc(t('typeMsg')) + '"><button class="btn" type="submit">' + esc(t('send')) + '</button></form></div>';
  S._initialMsgs = d.messages;
  return html;
};
function appendMsgs(list) {
  var box = document.getElementById('msgs');
  if (!box || !list.length) return;
  var near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  var nm = document.getElementById('noMsgs'); if (nm) nm.remove();
  list.forEach(function (m) {
    if (box.querySelector('[data-n="' + m.n + '"]')) return;
    var d = document.createElement('div');
    d.className = 'bubble ' + (m.senderId === S.user.id ? 'mine' : 'theirs');
    d.setAttribute('data-n', m.n);
    d.textContent = m.text;
    var tm = document.createElement('span'); tm.className = 'time'; tm.textContent = fmtTime(m.time);
    d.appendChild(tm);
    box.appendChild(d);
    if (m.n > chatLastN) chatLastN = m.n;
  });
  if (near) box.scrollTop = box.scrollHeight;
}
AFTER.chat = function () {
  var box = document.getElementById('msgs');
  appendMsgs(S._initialMsgs || []);
  S._initialMsgs = null;
  if (box) box.scrollTop = box.scrollHeight;
  var rid = chatReq;
  stopChat();
  chatTimer = setInterval(function () {
    api('GET', '/api/chat/' + encodeURIComponent(rid) + '?after=' + chatLastN).then(function (d) { appendMsgs(d.messages); })
      .catch(function (e) { stopChat(); if (e.status === 401) handleErr(e); else render(); });
  }, 2000);
};

/* ------------------------------------------------------------------ */
/* Polling (notification badge + automatic refresh)                    */
/* ------------------------------------------------------------------ */
var pollTimer = null, lastRev = null, pendingRefresh = false;
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function startPoll() { stopPoll(); poll(); pollTimer = setInterval(poll, 4000); }
function canRefresh() {
  if (S.view === 'chat' || modalEl.classList.contains('show')) return false;
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && app.contains(a)) return false;
  return true;
}
async function poll() {
  if (!S.user) return;
  try {
    var d = await api('GET', '/api/poll');
    S.unread = d.unread; updateBadge();
    if (lastRev === null) lastRev = d.rev;
    else if (d.rev !== lastRev) { lastRev = d.rev; pendingRefresh = true; }
    if (pendingRefresh && canRefresh()) { pendingRefresh = false; render(); }
  } catch (e) {
    if (e.status === 401 && S.user) { toast('Session expired. Please log in again.', 'err'); endSession(); render(); }
  }
}

  var act = el.dataset.do;
  await api('POST', '/api/requests/' + encodeURIComponent(el.dataset.id) + '/' + act);
  toast(act === 'accept' ? 'Request Accepted' : 'Request Rejected', 'ok');
  render();
};
A.viewUser = function (el) { var u = S.users[el.dataset.id]; if (u) showProfileModal(u); };
A.approveUser = async function (el) {
  await api('POST', '/api/admin/users/' + encodeURIComponent(el.dataset.id) + '/approve');
  toast('Account Verified', 'ok'); render();
};
A.rejectUser = async function (el) {
  await api('POST', '/api/admin/users/' + encodeURIComponent(el.dataset.id) + '/reject');
  toast('Account Rejected', 'ok'); render();
};
A.deleteUser = async function (el) {
  var u = S.users[el.dataset.id];
  var ok = await confirmBox(t('del') + '?', 'Permanently delete ' + (u ? u.name : 'this account') + '? This also removes their requests, chats and reviews.', t('del'));
  if (!ok) return;
  await api('DELETE', '/api/admin/users/' + encodeURIComponent(el.dataset.id));
  toast('Account deleted', 'ok'); render();
};
A.addCollege = function () { collegeFormModal(null); };
A.editCollege = function (el) { collegeFormModal(S.colleges[el.dataset.id]); };
A.deleteCollege = async function (el) {
  var c = S.colleges[el.dataset.id];
  var ok = await confirmBox(t('del') + '?', 'Delete ' + (c ? c.name : 'this college') + ' and its reviews?', t('del'));
  if (!ok) return;
  await api('DELETE', '/api/admin/colleges/' + encodeURIComponent(el.dataset.id));
  toast('College deleted', 'ok'); render();
};
A.deleteReview = async function (el) {
  var ok = await confirmBox(t('del') + '?', 'Delete this review?', t('del'));
  if (!ok) return;
  await api('DELETE', '/api/admin/reviews/' + encodeURIComponent(el.dataset.id));
  toast('Review deleted', 'ok'); render();
};

document.addEventListener('click', function (e) {
  if (e.target.classList && e.target.classList.contains('modal-back')) { closeModal(false); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = A[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve().then(function () { return fn(el, e); }).catch(handleErr);
});

/* ------------------------------------------------------------------ */
/* Forms (submit)                                                      */
/* ------------------------------------------------------------------ */
var F = {};
var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
F.login = async function (f) {
  var o = vals(f);
  if (!o.email || !o.password) return formErr('Email and password are required.');
  if (!EMAIL_RE.test(o.email)) return formErr('Please enter a valid email address.');
  formErr('');
  try {
    var data = await api('POST', '/api/login', { role: f.dataset.role, email: o.email, password: o.password });
    await startSession(data);
  } catch (e) { formErr(errMsg(e)); }
};
F.adminLogin = async function (f) {
  var o = vals(f);
  if (!o.username || !o.password) return formErr('Username and password are required.');
  formErr('');
  try {
    var data = await api('POST', '/api/admin/login', { username: o.username, password: o.password });
    await startSession(data);
  } catch (e) { formErr(e.code === 'INVALID_ADMIN' ? 'Invalid Admin credentials.' : errMsg(e)); }
};
F.register = async function (f) {
  var role = f.dataset.role, o = vals(f);
  var req = role === 'student'
    ? ['name', 'email', 'password', 'confirmPassword', 'phone', 'college', 'course', 'year', 'interests']
    : ['name', 'email', 'password', 'confirmPassword', 'phone', 'qualification', 'college', 'experience', 'expertise', 'bio'];
  for (var i = 0; i < req.length; i++) { if (!o[req[i]]) return formErr('Please fill in all fields.'); }
  if (!EMAIL_RE.test(o.email)) return formErr('Please enter a valid email address.');
  if (o.password.length < 6) return formErr('Password must be at least 6 characters.');
  if (o.password !== o.confirmPassword) return formErr(I18N[lang].err_PW_MISMATCH);
  if (o.phone.replace(/\D/g, '').length < 10) return formErr('Please enter a valid phone number (at least 10 digits).');
  if (role === 'mentor' && o.bio.length < 10) return formErr('Bio must be at least 10 characters.');
  formErr('');
  var btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    o.role = role;
    var r = await api('POST', '/api/register', o);
    S.flash = r.message === 'Your account approval request has been sent to Admin.' ? t('sentToAdmin') : r.message;
    toast(S.flash, 'ok');
    await nav('home', {}, { replace: true });
  } catch (e) { formErr(errMsg(e)); btn.disabled = false; }
};
F.review = async function (f) {
  var rating = Number(document.getElementById('rating').value) || 0;
  var text = f.elements.text.value.trim();
  if (rating < 1) return formErr('Please choose a star rating.');
  if (text.length < 5) return formErr('Please write a review (at least 5 characters).');
  formErr('');
  await api('POST', '/api/colleges/' + encodeURIComponent(f.dataset.id) + '/reviews', { rating: rating, text: text });
  toast('Review submitted successfully', 'ok');
  lastKey = ''; // fresh form after submit
  render();
};
F.college = async function (f) {
  var o = vals(f);
  if (!o.name || !o.location || !o.fees || !o.courses || !o.facilities || !o.admission || !o.description) return formErr('Please fill in all fields.');
  var id = o.id; delete o.id;
  try {
    if (id) await api('PUT', '/api/admin/colleges/' + encodeURIComponent(id), o);
    else await api('POST', '/api/admin/colleges', o);
    closeModal(false);
    toast(id ? 'College updated' : 'College added', 'ok');
    render();
  } catch (e) { formErr(errMsg(e)); }
};
F.chat = async function (f) {
  var inp = document.getElementById('msg');
  var text = inp.value.trim();
  if (!text) { toast('Message cannot be empty.', 'err'); return; }
  inp.value = '';
  try {
    var m = await api('POST', '/api/chat/' + encodeURIComponent(S.params.rid), { text: text });
    appendMsgs([m]);
    var box = document.getElementById('msgs'); if (box) box.scrollTop = box.scrollHeight;
  } catch (e) { inp.value = text; throw e; }
  inp.focus();
};
document.addEventListener('submit', function (e) {
  var f = e.target.closest ? e.target.closest('form[data-form]') : null;
  if (!f) return;
  e.preventDefault();
  var fn = F[f.dataset.form];
  if (fn) Promise.resolve().then(function () { return fn(f); }).catch(handleErr);
});

/* ------------------------------------------------------------------ */
/* Input / change listeners (do not re-render while typing)            */
/* ------------------------------------------------------------------ */
document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'cq') {
    S.cf.q = e.target.value;
    clearTimeout(cTimer); cTimer = setTimeout(reloadColleges, 250);
  } else if (id === 'mq') {
    var q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.mcard').forEach(function (c) { c.style.display = c.dataset.s.indexOf(q) >= 0 ? '' : 'none'; });
  }
});
document.addEventListener('change', function (e) {
  var id = e.target.id;
  if (id === 'lang') {
    lang = e.target.value; localStorage.setItem('et_lang', lang);
    document.documentElement.lang = lang;
    render();
  } else if (id === 'ctype') { S.cf.type = e.target.value; reloadColleges(); }
  else if (id === 'cstream') { S.cf.stream = e.target.value; reloadColleges(); }
});

/* ------------------------------------------------------------------ */
/* Boot                                                                */
/* ------------------------------------------------------------------ */
(async function init() {
  document.documentElement.lang = lang;
  history.replaceState({ view: 'home', params: {} }, '', location.pathname);
  if (S.token) {
    try {
      S.user = await api('GET', '/api/me');
      S.view = S.user.role; S.params = { tab: 'home' };
      history.replaceState({ view: S.view, params: S.params }, '', location.pathname);
      startPoll();
    } catch (e) { endSession(); }
  }
  render();
})();

})();
</script>
</body>
</html>
